# tmux config - Nitro terminal setup (~/.config/tmux/tmux.conf)

# Terminal and colours
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g focus-events on
set -sg escape-time 10

# Prefix: Ctrl+a instead of Ctrl+b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Behaviour
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off   # closing a session switches to another instead of exiting
setw -g mode-keys vi

# Splits and windows open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane movement and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode: v to select, y to copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# oh-my-pi coding agent in a side split (prefix + a)
bind a split-window -h -l 45% -c "#{pane_current_path}" "omp"

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# sesh: fuzzy session picker (prefix + T), jump to last session (prefix + S)
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '> ' \
    --header '  ^a all  ^t tmux  ^x zoxide  ^d kill session' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(> )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(tmux> )+reload(sesh list -t --icons)' \
    --bind 'ctrl-x:change-prompt(zoxide> )+reload(sesh list -z --icons)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(> )+reload(sesh list --icons)'
)\""
bind-key "S" run-shell "sesh last"

# Catppuccin Mocha status bar
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-position top
set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}"
