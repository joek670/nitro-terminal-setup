"$schema" = 'https://starship.rs/config-schema.json'

# Used by both PowerShell 7 (Windows) and bash (WSL).
add_newline = true
command_timeout = 1000
palette = "catppuccin_mocha"

format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$dotnet\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
style = "bold blue"
format = "[$symbol ]($style)"

[os.symbols]
Windows = ""
Ubuntu = ""
Linux = ""

[username]
show_always = false
style_user = "bold peach"
format = "[$user]($style) "

[directory]
style = "bold lavender"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol($version)]($style) "

[python]
symbol = " "
style = "bold yellow"
format = "[$symbol$pyenv_prefix($version)( \\($virtualenv\\))]($style) "

[rust]
symbol = " "
style = "bold peach"
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "bold sapphire"
format = "[$symbol($version)]($style) "

[dotnet]
symbol = " "
style = "bold teal"
format = "[$symbol($version)]($style) "

[docker_context]
symbol = " "
style = "bold sky"
format = "[$symbol$context]($style) "

[cmd_duration]
min_time = 2000
style = "bold yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
